<html lang="pt-BR">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--bg:#0e1116;--sf:#161a21;--sf2:#1e232c;--ln:rgba(255,255,255,.07);--tx:#f2f4f7;--mu:#8b93a1;--ac:#3d7bff;--fo:#ff7a2f;--e:cubic-bezier(.23,1,.32,1);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{min-height:100dvh;background:radial-gradient(120% 50% at 50% -12%,rgba(61,123,255,.18),transparent 60%) fixed,var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:auto;padding:22px 18px 48px}
h1,h2{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;line-height:1.05}
h1{font-size:30px}h2{font-size:22px;margin:32px 0 12px}
.mu{color:var(--mu);font-weight:400}
button,input,summary{font:inherit;color:inherit}
button{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;touch-action:manipulation;user-select:none;transition:transform .12s var(--e)}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#fff;border:0;font-weight:600;width:100%;padding:15px;font-size:17px;margin-top:18px;border-radius:14px;box-shadow:0 10px 24px -12px rgba(61,123,255,.8)}
.pri i{font-size:20px}
.pri:disabled{opacity:.35;box-shadow:none}
input{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%;font-size:16px}
input:focus{border-color:var(--ac);outline:0}
.ex{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:12px 0}
.ex header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.row{display:grid;grid-template-columns:60px 1fr 1fr;gap:8px;align-items:center;margin:8px 0}
.lin{display:flex;gap:8px;margin-top:10px}
.lin>*{flex:1}
.r1{grid-template-columns:60px 1fr}
.tt{margin-top:18px}
.vb{display:flex;gap:6px;align-items:center;background:none;border:0;color:var(--ac);padding:6px 0;margin-top:2px}
.vb i{font-size:20px}
.vi{margin:8px 0 6px;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000}
.vi iframe{width:100%;height:100%;border:0;display:block}
.pso{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;font-weight:600}
.pso>i{font-size:26px;color:var(--mu)}
.pso div{flex:1}
.pso small{display:block;color:var(--mu);font-size:14px;font-weight:400}
.pso b{font:700 26px 'Barlow Condensed',sans-serif}
.vz{border-color:rgba(61,123,255,.5)}
.vz>i:first-child{color:var(--ac)}
.ps{display:grid;grid-template-columns:1fr auto 90px;gap:10px;align-items:baseline;padding:14px 2px;border-bottom:1px solid var(--ln)}
.ps b{font-weight:600}
.ps span:last-child{text-align:right}
.ex header h1{font-size:26px}
.ex header .x{font-size:22px}
.dsc{min-height:80dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dsc>.mu{font-size:18px}
.rg{--p:100;width:250px;height:250px;margin:22px 0 30px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--sf2) 0);display:grid;place-items:center}
.rg b{width:222px;height:222px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 72px 'Barlow Condensed',sans-serif}
.dsc h1{margin-top:4px}
.dsc .pri{max-width:320px;margin-top:28px}
.x{background:none;border:0;color:var(--mu);padding:4px;font-size:20px;flex:none}
.fim{display:flex;justify-content:space-between;margin-top:28px}
.fim button{background:none;border:0;color:var(--mu);padding:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top small{display:block;color:var(--mu);font-size:15px}
.sai{display:flex;gap:6px;align-items:center;background:none;border:0;color:var(--mu);padding:8px 0}.sai i{font-size:20px}.pul{display:block;margin:10px 0 0 auto;background:none;border:0;padding:4px 0;color:var(--mu);font-size:14px}
.nv{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px;font-weight:600}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.bar i{height:6px;border-radius:3px;background:var(--sf2)}
.bar .ok{background:var(--ac)}
.prox{margin-top:14px;padding:18px;background:linear-gradient(155deg,#1b2335,var(--sf) 65%)}
.cab{display:flex;gap:14px;align-items:center}.prox .pri{margin-top:20px}
.let{flex:none;width:60px;height:60px;border-radius:17px;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 36px 'Barlow Condensed',sans-serif}
.st{display:flex;align-items:center;gap:5px;color:var(--fo)}
.st.zero{color:var(--mu)}
.dots{display:flex;justify-content:space-between;margin-top:14px}
.dot{width:36px;height:36px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;font-size:13px;color:var(--mu)}
.dot.on{background:var(--fo);color:#1c0d03;font-weight:600}
.dot.hj{box-shadow:inset 0 0 0 2px var(--tx)}
.in{animation:in .5s var(--e) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.in{animation:none}}
</style>
</head>

function login(){app.innerHTML=`<h1>Apk Gym</h1><p class="mu">Entre na sua conta ou crie uma nova.</p>
<div style="display:grid;gap:10px;margin-top:24px"><input id="nm" placeholder="Seu nome (só para criar conta)"><input id="em" type="email" placeholder="Email" autocapitalize="none"><input id="se" type="password" placeholder="Senha (mínimo 6 letras)">
<button class="pri" onclick="entrar(0,this)">Entrar</button><button onclick="entrar(1,this)">Criar conta</button></div>`}

async function entrar(novo,b){b.disabled=true;setTimeout(()=>b.disabled=false,3000);const email=v('em'),password=v('se')
const{data,error}=novo?await sb.auth.signUp({email,password,options:{data:{nome:v('nm')}}}):await sb.auth.signInWithPassword({email,password})

if(!data.session)return alert('Confirme o cadastro no seu email e depois clique em Entrar.')

async function carregar(u){me=u
let{data:p}=await sb.from('perfis').select('*').eq('id',u.id).maybeSingle()

if(!e.length){await sb.from('exercicios').insert(semente());({data:e}=await sb.from('exercicios').select('*'))}
plano=e;home()}

async function spes(b){const n=parseFloat(v('pk').replace(',','.'));if(!(n>0))return alert('Digite o peso, por exemplo 80,5')

async function nivel(){if(!confirm('Passar para '+P[pf.nivel+1][0]+'?'))return
Object.assign(pf,{nivel:pf.nivel+1,pos:0,feitos:0});await sb.from('perfis').update({nivel:pf.nivel,pos:0,feitos:0}).eq('id',me.id);home()}

async function sair(){await sb.auth.signOut();login()}

async function treino(){const ex=plano.filter(e=>e.nivel==pf.nivel&&e.ficha==F).sort((a,b)=>a.ordem-b.ordem)
const{data:u}=await sb.from('ultimo').select('*').in('nome',ex.map(e=>e.nome)),U=Object.fromEntries(u.map(x=>[x.nome,x.series]))
k=0;window.S=S=ex.map(e=>({e,s:[...Array(e.series)].map((_,i)=>({...(U[e.nome]?.[i]||U[e.nome]?.at(-1)||{r:'',p:''})}))}));tela()}

function tela(){const x=S[k],t=x&&/prancha/i.test(x.e.nome),u=k>=S.length-1,vd=x&&VD[x.e.nivel]?.[x.e.nome]
app.innerHTML=`<div class="top"><button class="sai" onclick="confirm('Sair sem salvar o treino?')&&home()"><i class="ph ph-arrow-left"></i>Sair</button><button class="sai" onclick="novo()"><i class="ph ph-plus"></i>Exercício</button></div>
<h1 class="tt">Treino ${F}</h1><p class="mu">${P[pf.nivel][2][F][0]}</p>
${x?`<div class="bar" style="margin-top:22px;grid-template-columns:repeat(${S.length},1fr)">${S.map((_,j)=>`<i class="${j<=k?'ok':''}"></i>`).join('')}</div>
<div class="ex in"><header><h1>${esc(x.e.nome)}</h1><button class="x" onclick="tirar()" aria-label="Remover exercício"><i class="ph ph-trash"></i></button></header>${vd?`<button class="vb" onclick="vid()"><i class="ph ph-${x.v?'x':'play-circle'}"></i>${x.v?'Fechar vídeo':'Ver como faz'}</button>${x.v?`<div class="vi"><iframe src="https://www.youtube-nocookie.com/embed/${vd}?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`:''}`:''}
<div class="row ${t?'r1':''} mu"><span></span>${t?'<span>Tempo (seg)</span>':'<span>Reps</span><span>Peso (kg)</span>'}</div>
${x.s.map((s,j)=>`<div class="row ${t?'r1':''}"><span class="mu">Série ${j+1}</span><input inputmode="numeric" value="${esc(s.r)}" oninput="S[${k}].s[${j}].r=this.value;chk()">${t?'':`<input inputmode="decimal" value="${esc(s.p)}" oninput="S[${k}].s[${j}].p=this.value">`}</div>`).join('')}
<div class="lin"><button onclick="serie(-1)">Tirar série</button><button onclick="serie(1)">Mais série</button></div></div>`:'<p class="mu" style="margin-top:24px">Nenhum exercício neste treino.</p>'}
<button class="pri" id="tb" ${x&&!ok()?'disabled':''} onclick="${u?'concluir(this)':'descanso()'}">${u?'Concluir treino':'Terminei o exercício'}</button>
${k?'<div class="fim"><button onclick="ant()">Exercício anterior</button></div>':''}`}

let tm
const ok=()=>S[k].s.every(s=>String(s.r).trim()),chk=()=>tb.disabled=!ok()
const parar=()=>clearInterval(tm)
function ant(){k--;tela()}
function vid(){S[k].v=!S[k].v;tela()}
function pular(){parar();k++;tela()}
function descanso(){const fim=Date.now()+6e4
app.innerHTML=`<div class="dsc in"><span class="mu">Descanso</span><div class="rg"><b></b></div><p class="mu">Próximo</p><h1>${esc(S[k+1].e.nome)}</h1><button class="pri" onclick="pular()">Pular</button></div>`
const rg=app.querySelector('.rg'),b=rg.firstChild,tick=()=>{const s=Math.max(0,Math.ceil((fim-Date.now())/1e3));b.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');rg.style.setProperty('--p',(fim-Date.now())/600);if(!s){navigator.vibrate?.(400);pular()}}
parar();tick();tm=setInterval(tick,250)}

async function serie(d){const x=S[k];if(d<0&&x.s.length<2)return
d>0?x.s.push({...x.s.at(-1)}):x.s.pop();x.e.series=x.s.length
await sb.from('exercicios').update({series:x.e.series}).eq('id',x.e.id);tela()}

async function tirar(){if(!confirm('Remover '+S[k].e.nome+' deste treino?'))return
await sb.from('exercicios').delete().eq('id',S[k].e.id);plano=plano.filter(e=>e!=S[k].e);S.splice(k,1);k=Math.max(0,Math.min(k,S.length-1));tela()}

async function novo(){const nome=prompt('Nome do exercício')?.trim();if(!nome)return
const{data:e,error}=await sb.from('exercicios').insert({nivel:pf.nivel,ficha:F,ordem:Math.max(-1,...S.map(x=>x.e.ordem))+1,nome,series:3}).select().single()
if(error)return alert('Esse exercício já está neste treino.')
plano.push(e);S.push({e,s:[0,1,2].map(()=>({r:'',p:''}))});tela()}

async function concluir(b){b.disabled=true;await sb.from('ultimo').upsert(S.filter(x=>x.s.some(s=>s.r||s.p)).map(x=>({user_id:me.id,nome:x.e.nome,series:x.s})))
await sb.from('treinos').insert({data:hoje(),nivel:pf.nivel,ficha:F})
pf.pos++;pf.feitos++;if(pf.nivel<3&&pf.feitos>=5)Object.assign(pf,{nivel:pf.nivel+1,pos:0,feitos:0})
await sb.from('perfis').update({nivel:pf.nivel,pos:pf.pos,feitos:pf.feitos}).eq('id',me.id);home()}

Object.assign(window,{entrar,treino,nivel,sair,serie,tirar,novo,concluir,home,pular,descanso,ant,chk,pesos,spes,vid})
const{data:{session}}=await sb.auth.getSession();session?carregar(session.user):login()
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')
</script>
</body>
</html>
